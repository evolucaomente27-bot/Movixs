name: app
description: "Movixs - O seu streaming definitivo de filmes e séries."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  webview_windows: ^0.4.0
  http: ^1.2.0
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
